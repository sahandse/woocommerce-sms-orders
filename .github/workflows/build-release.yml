name: Build WooCommerce SMS Orders ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'woocommerce-sms-orders.php'
      - 'assets/**'
      - 'readme.txt'
      - 'README.md'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'Version:' woocommerce-sms-orders.php | head -1 | sed 's/.*Version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        run: php -l woocommerce-sms-orders.php

      - name: Build ZIP
        shell: bash
        run: |
          rm -rf dist build
          mkdir -p dist build/woocommerce-sms-orders
          cp woocommerce-sms-orders.php readme.txt README.md build/woocommerce-sms-orders/
          cp -R assets build/woocommerce-sms-orders/
          cd build
          zip -qr ../dist/woocommerce-sms-orders.zip woocommerce-sms-orders

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: woocommerce-sms-orders-v${{ steps.version.outputs.version }}
          path: dist/woocommerce-sms-orders.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="woocommerce-sms-orders-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/woocommerce-sms-orders.zip --clobber
          else
            gh release create "$TAG" dist/woocommerce-sms-orders.zip --title "WooCommerce SMS Orders v${VERSION}" --notes "Installable WordPress ZIP for WooCommerce SMS Orders v${VERSION}."
          fi
